name: Build iOS IPA (Sideloadly Ready)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios

      - name: Compile Unsigned IPA for Sideloading
        run: |
          cd ios
          xcodebuild -workspace biostackpro.xcworkspace \
                     -scheme biostackpro \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
          
          mkdir -p ../dist/Payload
          cp -r build/Build/Products/Release-iphoneos/biostackpro.app ../dist/Payload/
          cd ../dist
          zip -r BioStack_PRO_iOS.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioStack-PRO-Sideloadly
          path: dist/BioStack_PRO_iOS.ipa
          retention-days: 7
