name: Build iOS IPA (Sideloadly Ready)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Compile Unsigned IPA for Sideloading
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -json | node -e "const data = JSON.parse(require('fs').readFileSync(0, 'utf-8')); console.log(data.workspace ? data.workspace.schemes[0] : data.project.schemes[0]);")
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"
          
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
          
          mkdir -p ../dist/Payload
          cp -r build/Build/Products/Release-iphoneos/*.app ../dist/Payload/
          cd ../dist
          zip -r BioStack_PRO_iOS.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioStack-PRO-Sideloadly
          path: dist/BioStack_PRO_iOS.ipa
          retention-days: 7
